<section class="hero">
	<div class="hero-image">
		<img src="images/hero-image.webp" alt="Hero Image">
	</div>
	<div>
		<h2>Hello there,</h2>
		<h1>I'm <span>{{ .Site.Params.author }}</span></h1>
		<h3>{{ .Site.Params.tagline }}</h3>
		<p class="biography">{{ .Site.Params.biography | markdownify}}</p>

		<!-- Resume Button -->
		<a class="btn resume-button" target="_blank" href="files/resume.pdf">Resume</a>
		<!-- Socials -->
		{{ partial "socials.html" . }}
	</div>
</section>
