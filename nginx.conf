server {
    listen 80;
    server_name localhost;

    # Where the Vite build lives
    root /usr/share/nginx/html;
    index index.html;

    # Support for Vite's SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle /resume by serving the PDF directly
    # This matches what your Vite dev plugin was trying to do
    location /resume {
        # Note: Ensure your PDF is actually at dist/resume/resume.pdf
        # If it's named differently, change 'resume.pdf' below
        alias /usr/share/nginx/html/resume/resume.pdf;
        default_type application/pdf;
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}